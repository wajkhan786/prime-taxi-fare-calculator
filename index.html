<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prime Taxis Fare Calculator</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f5f7;
    margin:0;
    padding:20px;
    color:#222;
}

.box{
    max-width:520px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 3px 15px rgba(0,0,0,.12);
}

h1{
    margin-top:0;
    text-align:center;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

label{
    display:block;
    font-weight:bold;
    margin-top:15px;
    margin-bottom:6px;
}

input,select,button{
    width:100%;
    box-sizing:border-box;
    padding:14px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
}

button{
    background:#111;
    color:white;
    font-weight:bold;
    cursor:pointer;
    margin-top:20px;
}

button:hover{
    background:#333;
}

.result{
    background:#eef7ee;
    padding:20px;
    margin-top:20px;
    border-radius:12px;
}

.price{
    font-size:38px;
    font-weight:bold;
    text-align:center;
    margin:10px 0 20px;
}

.details{
    line-height:1.7;
}

.error{
    color:#a00;
    background:#fff0f0;
    padding:12px;
    border-radius:8px;
    margin-top:15px;
}

.small{
    color:#666;
    font-size:13px;
    margin-top:5px;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

hr{
    border:0;
    border-top:1px solid #ddd;
    margin:18px 0;
}

.loading{
    text-align:center;
    padding:15px;
    color:#555;
}

@media(max-width:500px){
    .row{
        grid-template-columns:1fr;
    }

    body{
        padding:10px;
    }

    .box{
        padding:18px;
    }
}
</style>
</head>

<body>

<div class="box">

<h1>Prime Taxis</h1>

<p class="subtitle">
Waverley By-the-Book Fare Calculator
</p>

<label for="from">
From
</label>

<input
    id="from"
    placeholder="Postcode or road/location name"
>

<div class="small">
Example: GU7 1AA, Godalming Station, High Street, Farnham
</div>


<label for="to">
To
</label>

<input
    id="to"
    placeholder="Postcode or road/location name"
>

<div class="small">
You can enter a postcode OR a location/road name.
</div>


<div class="row">

<div>
<label for="passengers">
Passengers
</label>

<input
    id="passengers"
    type="number"
    min="1"
    value="1"
>
</div>

<div>
<label for="traffic">
Traffic / waiting minutes
</label>

<input
    id="traffic"
    type="number"
    min="0"
    step="1"
    value="0"
>
</div>

</div>


<label for="dateTime">
Journey date and time
</label>

<input
    id="dateTime"
    type="datetime-local"
>


<label for="tariff">
Tariff
</label>

<select id="tariff">

<option value="auto">
Automatic
</option>

<option value="1">
Tariff 1 - Day
</option>

<option value="2">
Tariff 2 - Evening / Bank Holiday
</option>

<option value="3">
Tariff 3 - Christmas / New Year
</option>

</select>


<button onclick="calculateFare()">
CALCULATE FARE
</button>


<div id="loading" class="loading" style="display:none;">
Finding locations and calculating route...
</div>


<div id="error"></div>


<div id="result" class="result" style="display:none;">

<div class="price" id="fare">
£0.00
</div>

<div class="details" id="details">
</div>

</div>

</div>


<script>

/* =========================================================
   WAVERLEY FARE SETTINGS
   ========================================================= */

const FARES = {

    tariff1: {
        firstMileWeekday: 4.96,
        firstMileSunday: 5.56,
        additionalMile: 2.76,
        trafficFirst: 2.40,
        trafficAdditional: 0.20
    },

    tariff2: {
        firstMile: 7.43,
        additionalMile: 4.13,
        trafficFirst: 3.60,
        trafficAdditional: 0.30
    },

    tariff3: {
        firstMile: 9.91,
        additionalMile: 5.52,
        trafficFirst: 4.80,
        trafficAdditional: 0.40
    },

    bookingFee: 0.60,

    extraPassenger: 0.30,

    secondsPerTrafficUnit: 22
};


/* =========================================================
   SET CURRENT DATE/TIME
   ========================================================= */

window.addEventListener("load", function(){

    const now = new Date();

    const local =
        new Date(
            now.getTime()
            - now.getTimezoneOffset() * 60000
        )
        .toISOString()
        .slice(0,16);

    document.getElementById("dateTime").value = local;

});


/* =========================================================
   DETERMINE TARIFF
   ========================================================= */

function getAutomaticTariff(date){

    const day = date.getDay();

    const hour = date.getHours();

    /*
       Sunday daytime:
       Waverley Sunday daytime uses the Sunday first-mile rate.
       We keep this as Tariff 1 with the Sunday first-mile rate.
    */

    if(day === 0){

        if(hour >= 7 && hour < 23){
            return 1;
        }

        return 2;
    }


    /*
       Monday-Saturday:
       Tariff 1 = 7am to 11pm
       Tariff 2 = 11pm to 7am
    */

    if(hour >= 7 && hour < 23){
        return 1;
    }

    return 2;
}


/* =========================================================
   GEOCODE LOCATION
   ========================================================= */

async function geocode(place){

    const url =
        "https://nominatim.openstreetmap.org/search" +
        "?format=json" +
        "&limit=1" +
        "&countrycodes=gb" +
        "&q=" +
        encodeURIComponent(place);

    const response = await fetch(url,{
        headers:{
            "Accept":"application/json"
        }
    });

    if(!response.ok){
        throw new Error(
            "Unable to find location: " + place
        );
    }

    const data = await response.json();

    if(!data.length){
        throw new Error(
            "Location not found: " + place +
            ". Please try a postcode, road name or location name."
        );
    }

    return {
        lat:parseFloat(data[0].lat),
        lon:parseFloat(data[0].lon),
        name:data[0].display_name
    };
}


/* =========================================================
   GET ROUTE DISTANCE
   ========================================================= */

async function getRoute(from,to){

    const url =
        "https://router.project-osrm.org/route/v1/driving/" +
        from.lon + "," + from.lat +
        ";" +
        to.lon + "," + to.lat +
        "?overview=false";

    const response = await fetch(url);

    if(!response.ok){
        throw new Error(
            "Unable to calculate driving route."
        );
    }

    const data = await response.json();

    if(
        !data.routes ||
        !data.routes.length
    ){
        throw new Error(
            "No driving route could be found."
        );
    }

    return {
        distanceMiles:
            data.routes[0].distance / 1609.344,

        durationMinutes:
            data.routes[0].duration / 60
    };
}


/* =========================================================
   CALCULATE DISTANCE FARE
   ========================================================= */

function calculateDistanceFare(
    miles,
    tariff,
    isSunday
){

    let firstMile;

    let additionalMile;


    if(tariff === 1){

        if(isSunday){
            firstMile =
                FARES.tariff1.firstMileSunday;
        }else{
            firstMile =
                FARES.tariff1.firstMileWeekday;
        }

        additionalMile =
            FARES.tariff1.additionalMile;

    }


    else if(tariff === 2){

        firstMile =
            FARES.tariff2.firstMile;

        additionalMile =
            FARES.tariff2.additionalMile;

    }


    else{

        firstMile =
            FARES.tariff3.firstMile;

        additionalMile =
            FARES.tariff3.additionalMile;

    }


    if(miles <= 1){

        return firstMile;
    }


    return firstMile +
        Math.ceil(miles - 1) *
        additionalMile;
}


/* =========================================================
   CALCULATE TRAFFIC / WAITING CHARGE
   ========================================================= */

function calculateTrafficCharge(
    minutes,
    tariff
){

    if(minutes <= 0){
        return 0;
    }


    /*
       Waverley uses 22 seconds per unit.
       We round UP because a part of a 22-second period
       counts as another unit.
    */

    const seconds =
        minutes * 60;

    const units =
        Math.ceil(
            seconds /
            FARES.secondsPerTrafficUnit
        );


    let firstCharge;
    let additionalCharge;


    if(tariff === 1){

        firstCharge =
            FARES.tariff1.trafficFirst;

        additionalCharge =
            FARES.tariff1.trafficAdditional;

    }

    else if(tariff === 2){

        firstCharge =
            FARES.tariff2.trafficFirst;

        additionalCharge =
            FARES.tariff2.trafficAdditional;

    }

    else{

        firstCharge =
            FARES.tariff3.trafficFirst;

        additionalCharge =
            FARES.tariff3.trafficAdditional;

    }


    if(units <= 1){

        return firstCharge;
    }


    return firstCharge +
        (units - 1) *
        additionalCharge;
}


/* =========================================================
   MAIN CALCULATOR
   ========================================================= */

async function calculateFare(){

    const fromText =
        document.getElementById("from")
        .value
        .trim();

    const toText =
        document.getElementById("to")
        .value
        .trim();


    const passengers =
        parseInt(
            document.getElementById("passengers")
            .value
        ) || 1;


    const trafficMinutes =
        parseFloat(
            document.getElementById("traffic")
            .value
        ) || 0;


    const dateTimeValue =
        document.getElementById("dateTime")
        .value;


    const tariffChoice =
        document.getElementById("tariff")
        .value;


    const error =
        document.getElementById("error");

    const result =
        document.getElementById("result");

    const loading =
        document.getElementById("loading");


    error.innerHTML = "";

    result.style.display = "none";


    if(!fromText || !toText){

        error.innerHTML =
            '<div class="error">' +
            'Please enter both the pickup and destination.' +
            '</div>';

        return;
    }


    if(passengers < 1){

        error.innerHTML =
            '<div class="error">' +
            'Passengers must be at least 1.' +
            '</div>';

        return;
    }


    loading.style.display = "block";


    try{

        /* FIND LOCATIONS */

        const from =
            await geocode(fromText);

        const to =
            await geocode(toText);


        /* CALCULATE ROAD DISTANCE */

        const route =
            await getRoute(from,to);


        const miles =
            route.distanceMiles;


        /* JOURNEY DATE */

        const journeyDate =
            dateTimeValue
            ? new Date(dateTimeValue)
            : new Date();


        const isSunday =
            journeyDate.getDay() === 0;


        /* TARIFF */

        let tariff;


        if(tariffChoice === "auto"){

            tariff =
                getAutomaticTariff(
                    journeyDate
                );

        }else{

            tariff =
                parseInt(tariffChoice);

        }


        /* DISTANCE FARE */

        const distanceFare =
            calculateDistanceFare(
                miles,
                tariff,
                isSunday
            );


        /* TRAFFIC / WAITING */

        const trafficCharge =
            calculateTrafficCharge(
                trafficMinutes,
                tariff
            );


        /* EXTRA PASSENGERS */

        const extraPassengers =
            Math.max(
                0,
                passengers - 1
            );


        const passengerCharge =
            extraPassengers *
            FARES.extraPassenger;


        /* BOOKING FEE */

        const bookingFee =
            FARES.bookingFee;


        /* TOTAL */

        const total =
            distanceFare +
            trafficCharge +
            passengerCharge +
            bookingFee;


        /* DISPLAY */

        document.getElementById("fare")
            .innerText =
            "£" +
            total.toFixed(2);


        let tariffName;


        if(tariff === 1){

            tariffName =
                isSunday
                ? "Tariff 1 - Sunday"
                : "Tariff 1 - Day";

        }

        else if(tariff === 2){

            tariffName =
                "Tariff 2 - Evening / Bank Holiday";

        }

        else{

            tariffName =
                "Tariff 3 - Christmas / New Year";

        }


        document.getElementById("details")
            .innerHTML =

            "<b>" +
            tariffName +
            "</b><br>" +

            "From: " +
            escapeHtml(fromText) +
            "<br>" +

            "To: " +
            escapeHtml(toText) +
            "<br><br>" +

            "<b>Distance:</b> " +
            miles.toFixed(2) +
            " miles<br>" +

            "<b>Estimated driving time:</b> " +
            Math.round(route.durationMinutes) +
            " minutes<br><br>" +

            "<b>Distance fare:</b> £" +
            distanceFare.toFixed(2) +
            "<br>" +

            "<b>Traffic / waiting:</b> £" +
            trafficCharge.toFixed(2) +
            "<br>" +

            "<b>Booking fee:</b> £" +
            bookingFee.toFixed(2) +
            "<br>" +

            "<b>Extra passengers:</b> £" +
            passengerCharge.toFixed(2) +
            "<br>" +

            "<hr>" +

            "<b>Total fare:</b> £" +
            total.toFixed(2) +

            "<br><br>" +

            "<span class='small'>" +
            "This calculator uses the Waverley fare scale as a maximum fare. " +
            "Private hire fares may be agreed in advance." +
            "</span>";


        result.style.display = "block";


    }catch(e){

        error.innerHTML =
            '<div class="error">' +
            escapeHtml(e.message) +
            '</div>';

    }


    loading.style.display = "none";
}


/* =========================================================
   SAFELY DISPLAY USER TEXT
   ========================================================= */

function escapeHtml(text){

    return text
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

</script>

</body>
</html>
