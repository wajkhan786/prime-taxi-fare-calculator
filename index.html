<!DOCTYPE html>
<html lang="en">

<head>

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Prime Taxis Fare Calculator</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f4f5f7;
margin:0;
padding:15px;
}

.box{
max-width:520px;
margin:auto;
background:white;
padding:22px;
border-radius:20px;
box-sizing:border-box;
}

h1{
margin-top:0;
}

label{
font-weight:bold;
display:block;
margin-top:15px;
}

input,
select,
button{
width:100%;
padding:14px;
margin-top:6px;
border:1px solid #ccc;
border-radius:10px;
font-size:16px;
box-sizing:border-box;
}

button{
background:#111;
color:white;
font-weight:bold;
margin-top:20px;
}

button:disabled{
opacity:.6;
}

.result{
background:#eef7ee;
padding:18px;
margin-top:20px;
border-radius:12px;
}

.price{
font-size:38px;
font-weight:bold;
margin:8px 0 20px 0;
}

.error{
color:#a00;
margin-top:15px;
}

.small{
font-size:14px;
color:#666;
margin-top:6px;
}

hr{
border:0;
border-top:1px solid #ddd;
margin:18px 0;
}

.loading{
text-align:center;
padding:15px;
font-weight:bold;
}

</style>

</head>


<body>

<div class="box">

<h1>Prime Taxis</h1>

<p>
Waverley By-the-Book Fare Calculator
</p>


<label>From</label>

<input
id="from"
placeholder="Postcode, road or location"
autocomplete="off"
>

<div class="small">
Example: GU7 1AA, Mill Lane Godalming, Godalming Station
</div>


<label>To</label>

<input
id="to"
placeholder="Postcode, road or location"
autocomplete="off"
>

<div class="small">
Example: GU2 7XX, Royal Surrey County Hospital
</div>


<label>Journey date</label>

<input
id="date"
type="date"
>


<label>Pickup time</label>

<input
id="time"
type="time"
value="12:00"
>


<label>Passengers</label>

<select id="pass">

<option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
<option value="4">4</option>
<option value="5">5</option>
<option value="6">6</option>
<option value="7">7</option>
<option value="8">8</option>

</select>


<label>Booking</label>

<select id="booking">

<option value="yes">
Pre-booked (£0.60)
</option>

<option value="no">
Rank / street hire
</option>

</select>


<button
id="calculateButton"
onclick="calculate()"
>

CALCULATE FARE

</button>


<div
id="loading"
class="loading"
style="display:none"
>

Calculating route and fare...

</div>


<div
id="result"
class="result"
style="display:none"
>


<div>Estimated fare</div>

<div
id="fare"
class="price"
>

£0.00

</div>


<b id="tariffName">
Tariff 1 - Day
</b>


<div id="routeInfo"></div>


<hr>


<div id="fareBreakdown"></div>


</div>


<div id="error"></div>


</div>


<script>


/* =========================
   DEFAULT DATE
========================= */

const dateInput =
document.getElementById("date");

dateInput.value =
new Date().toISOString().slice(0,10);


/* =========================
   LOCATION SEARCH
========================= */

async function locationSearch(place){

place = place.trim();

if(!place){

throw new Error(
"Please enter a postcode or location."
);

}


/*
Try postcode first.
This is faster and more accurate
when the user enters a UK postcode.
*/

let postcode =
place
.replace(/\s/g,"")
.toUpperCase();


if(
/^[A-Z]{1,2}\d[A-Z\d]?\d[A-Z]{2}$/.test(postcode)
){

let response =
await fetch(
"https://api.postcodes.io/postcodes/" +
postcode
);

if(response.ok){

let data =
await response.json();

if(
data.result &&
data.result.latitude &&
data.result.longitude
){

return {

lat:data.result.latitude,

lon:data.result.longitude,

name:place

};

}

}

}


/*
If it isn't a postcode, use
OpenStreetMap Nominatim to find
the road/location.
*/

let url =
"https://nominatim.openstreetmap.org/search?" +
"format=json" +
"&countrycodes=gb" +
"&limit=1" +
"&q=" +
encodeURIComponent(place);


let response =
await fetch(url);


if(!response.ok){

throw new Error(
"Location search failed."
);

}


let data =
await response.json();


if(!data.length){

throw new Error(
"Location not found: " + place
);

}


return {

lat:parseFloat(data[0].lat),

lon:parseFloat(data[0].lon),

name:data[0].display_name

};

}


/* =========================
   ROUTE
========================= */

async function route(a,b){

let url =
"https://router.project-osrm.org/route/v1/driving/" +

a.lon + "," +
a.lat +

";" +

b.lon + "," +
b.lat +

"?overview=false";


let response =
await fetch(url);


if(!response.ok){

throw new Error(
"Route could not be calculated."
);

}


let data =
await response.json();


if(
!data.routes ||
!data.routes.length
){

throw new Error(
"No driving route was found."
);

}


return {

miles:
data.routes[0].distance / 1609.344,

minutes:
data.routes[0].duration / 60

};

}


/* =========================
   TARIFF
========================= */

function tariff(){

let dateValue =
document.getElementById("date").value;

let timeValue =
document.getElementById("time").value;


let date =
new Date(
dateValue + "T12:00:00"
);


let hour =
parseInt(
timeValue.split(":")[0]
);


let day =
date.getDay();

let month =
date.getMonth() + 1;

let dom =
date.getDate();


/*
Christmas and New Year
Tariff 3
*/

if(

(month === 12 &&
dom === 24 &&
hour >= 23)

||

(month === 12 &&
(dom === 25 || dom === 26))

||

(month === 12 &&
dom === 27 &&
hour < 7)

||

(month === 12 &&
dom === 31 &&
hour >= 23)

||

(month === 1 &&
(dom === 1 ||
(dom === 2 && hour < 7)))

){

return {

first:9.91,

additional:5.52,

unit:0.40,

initial:3.20,

name:"Tariff 3 - Christmas / New Year"

};

}


/*
Tariff 2
11pm to 7am
Sunday
Bank Holidays
New Year's Eve 6pm to 11pm
*/

let bankHolidays = [

"2026-01-01",
"2026-04-03",
"2026-04-06",
"2026-05-04",
"2026-05-25",
"2026-08-31",
"2026-12-25",
"2026-12-28"

];


if(

hour >= 23 ||

hour < 7 ||

day === 0 ||

bankHolidays.includes(dateValue)

||

(
month === 12 &&
dom === 31 &&
hour >= 18
)

){

return {

first:7.43,

additional:4.13,

unit:0.30,

initial:3.60,

name:"Tariff 2 - Evening / Night / Bank Holiday"

};

}


/*
Normal Tariff 1
*/

let firstMile = 4.96;


/*
Sunday first mile
*/

if(day === 0){

firstMile = 5.56;

}


return {

first:firstMile,

additional:2.76,

unit:0.20,

initial:2.40,

name:"Tariff 1 - Day"

};

}


/* =========================
   FARE CALCULATION
========================= */

function calculateFare(
miles,
minutes,
t
){

/*
Waverley rule:

128 yards OR 22 seconds,
whichever occurs first.

We calculate how many meter
units are required by distance
and by time.

Then we use whichever gives
the larger number of units.
*/

let distanceUnits =
(miles * 1760) / 128;


let timeUnits =
(minutes * 60) / 22;


let meterUnits =
Math.max(
distanceUnits,
timeUnits
);


/*
The first mile is priced using
the published first-mile fare.

For the additional part we keep
the published Waverley mileage
rate as the distance calculation.

Then we check whether journey
time creates additional meter
units beyond the distance charge.
*/


let distanceFare;


/*
Published mileage calculation
*/

if(miles <= 1){

distanceFare =
t.first;

}else{

distanceFare =
t.first +
(
Math.ceil(miles - 1)
*
t.additional
);

}


/*
Calculate the approximate number
of 128-yard units represented by
the mileage portion.

This lets us identify extra time
caused by traffic / slow journeys.
*/

let distanceMeterUnits =
(miles * 1760) / 128;


/*
Only add a time component when
time requires more meter units
than distance.

This prevents normal driving
time from being charged twice.
*/

let extraTimeUnits =
Math.max(
0,
Math.ceil(timeUnits - distanceMeterUnits)
);


let trafficWaiting =
extraTimeUnits * t.unit;


/*
Total before booking/passengers
*/

let fare =
distanceFare +
trafficWaiting;


/*
Booking fee
*/

let bookingFee = 0;

if(
document.getElementById("booking").value === "yes"
){

bookingFee = 0.60;

fare += bookingFee;

}


/*
Additional passengers

30p per additional passenger
*/

let passengers =
parseInt(
document.getElementById("pass").value
);


let passengerCharge = 0;


if(passengers > 1){

passengerCharge =
(passengers - 1) * 0.30;

fare += passengerCharge;

}


fare =
Math.round(fare * 100) / 100;


return {

fare:fare,

distanceFare:
Math.round(distanceFare * 100) / 100,

trafficWaiting:
Math.round(trafficWaiting * 100) / 100,

bookingFee:
bookingFee,

passengerCharge:
passengerCharge,

distanceUnits:
distanceUnits,

timeUnits:
timeUnits,

extraTimeUnits:
extraTimeUnits

};

}


/* =========================
   MAIN CALCULATOR
========================= */

async function calculate(){

let error =
document.getElementById("error");

let result =
document.getElementById("result");

let loading =
document.getElementById("loading");

let button =
document.getElementById("calculateButton");


error.innerHTML = "";

result.style.display = "none";

loading.style.display = "block";

button.disabled = true;


try{

let from =
document.getElementById("from").value;

let to =
document.getElementById("to").value;


if(!from || !to){

throw new Error(
"Please enter both From and To locations."
);

}


/*
Find both locations
*/

let locations =
await Promise.all([

locationSearch(from),

locationSearch(to)

]);


/*
Calculate driving route
*/

let r =
await route(
locations[0],
locations[1]
);


/*
Select tariff
*/

let t =
tariff();


/*
Calculate fare
*/

let f =
calculateFare(
r.miles,
r.minutes,
t
);


/*
Display total
*/

document.getElementById("fare").innerText =
"£" + f.fare.toFixed(2);


/*
Display tariff
*/

document.getElementById("tariffName").innerText =
t.name;


/*
Display route information
*/

document.getElementById("routeInfo").innerHTML =

"<b>From:</b> " +
escapeHtml(from) +

"<br>" +

"<b>To:</b> " +
escapeHtml(to) +

"<br><br>" +

"<b>Distance:</b> " +
r.miles.toFixed(2) +
" miles" +

"<br>" +

"<b>Estimated driving time:</b> " +
Math.round(r.minutes) +
" minutes";


/*
Display fare breakdown
*/

document.getElementById("fareBreakdown").innerHTML =

"<b>Distance fare:</b> £" +
f.distanceFare.toFixed(2) +

"<br>" +

"<b>Traffic / time:</b> £" +
f.trafficWaiting.toFixed(2) +

"<br>" +

"<b>Booking fee:</b> £" +
f.bookingFee.toFixed(2) +

"<br>" +

"<b>Extra passengers:</b> £" +
f.passengerCharge.toFixed(2) +

"<br><br>" +

"<b>Meter units by distance:</b> " +
f.distanceUnits.toFixed(1) +

"<br>" +

"<b>Meter units by time:</b> " +
f.timeUnits.toFixed(1) +

"<br><br>" +

"<small>" +

"Traffic/time is only added when the estimated journey time " +
"requires more 128-yard/22-second meter units than the distance." +

"</small>";


result.style.display = "block";


}

catch(e){

error.innerHTML =
"<div class='error'>" +
escapeHtml(e.message) +
"</div>";

}

finally{

loading.style.display = "none";

button.disabled = false;

}

}


/* =========================
   SECURITY / TEXT ESCAPING
========================= */

function escapeHtml(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

</script>

</body>

</html>
